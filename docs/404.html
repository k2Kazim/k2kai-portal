  <style>
    :root{
      color-scheme:dark;
      --bg:#050a12;
      --bg-soft:#07111f;
      --surface:#0b1523;
      --surface-2:#101e30;
      --surface-3:#15283c;

      --red:#ff8585;

      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;

    button,a{touch-action:manipulation}
    button{color:inherit}
    a{color:inherit;text-decoration:none}

    .lang-btn{padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.04em}

    function saudiDate(){
      const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
      const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`
    }
    function saudiTime(){return new Intl.DateTimeFormat(state.lang==="bn"?"bn-BD":"en-GB",{timeZone:"Asia/Riyadh",weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}).format(new Date())}
    function todayDay(){const d=saudiDate();return DAYS.find(x=>x.date===d)|| (d<DAYS[0].date?DAYS[0]:DAYS[DAYS.length-1])}
    function tripDayIndex(){const d=saudiDate(),idx=DAYS.findIndex(x=>x.date===d);return idx>=0?idx:(d<DAYS[0].date?0:DAYS.length-1)}
    function relativeLabel(day){const now=saudiDate();if(day.date===now)return t("today");const idx=DAYS.findIndex(x=>x.date===day.date),cur=DAYS.findIndex(x=>x.date===now);if(cur>=0&&idx===cur+1)return t("tomorrow");return l(day.week)}
    function nextActivity(){
      const nowDate=saudiDate(),nowTime=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Riyadh",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
      for(const d of DAYS){if(d.date<nowDate)continue;for(const a of d.activities){if(state.completed[a.id])continue;if(d.date===nowDate&&a.time<nowTime)continue;return{day:d,activity:a}}}
      for(const d of DAYS)for(const a of d.activities)if(!state.completed[a.id])return{day:d,activity:a};return null
    }
    function selectedHotel(){return HOTELS.find(h=>h.id===state.selectedHotel)||null}
    function hotelTotal(id){const q=state.hotelQuotes[id];return q?q.units*q.nightly*q.nights+q.fees:0}
    function selectedTotal(){return state.selectedHotel?hotelTotal(state.selectedHotel):0}
    function presentCount(){return MEMBERS.filter(m=>state.present[m.id]).length}
    function doneCount(){return Object.values(state.completed).filter(Boolean).length}
    function totalActivities(){return DAYS.reduce((n,d)=>n+d.activities.length,0)}
    function appUrl(){try{const u=new URL(location.href);if(["http:","https:"].includes(u.protocol)&&u.hostname!=="localhost"&&u.hostname!=="127.0.0.1")return u.href}catch(_){}return PUBLIC_URL}
    function mapLink(placeId,apple=false){const p=PLACES.find(x=>x.id===placeId);return p?(apple?p.a:p.g):""}

    function render(){
      document.documentElement.lang=state.lang;
      document.querySelector(".lang-btn").textContent=state.lang==="bn"?"EN":"বাংলা";
      document.getElementById("shareTop").innerHTML=icon("share",19);
      document.querySelector(".sheet-close").innerHTML=icon("close",18);
      document.getElementById("brandSub").textContent=t("tripRoute")+" · 2026";
      renderNav();
      const main=document.getElementById("main");
      main.innerHTML=`<section class="screen">${state.tab==="home"?renderHome():state.tab==="plan"?renderPlan():state.tab==="explore"?renderExplore():state.tab==="stay"?renderStay():renderMore()}</section>`;
      if(state.tab==="plan")requestAnimationFrame(()=>{const strip=document.querySelector(".day-strip"),active=strip&&strip.querySelector(".day-chip.active");if(strip&&active)strip.scrollLeft=Math.max(0,active.offsetLeft-(strip.clientWidth-active.clientWidth)/2)});
      save();
    }
    function renderNav(){
      const items=[["home","home",t("home")],["plan","calendar",t("plan")],["explore","pin",t("explore")],["stay","hotel",t("stay")],["more","more",t("more")]];

    }
    function renderHome(){

            </div>

        </article>
        <div class="trust-strip">${icon("check",18)}<div><strong>${state.lang==="bn"?"Verified-only route active":"Verified-only route active"}</strong><span>${state.lang==="bn"?"১৫ আগস্ট ২০২৬ যাচাই: Prince Hussam ও Raghadan official 2026 active; coast-এ শুধু public South Corniche ও Al Nakheel Beach রাখা হয়েছে।":"Verified 15 Aug 2026: Prince Hussam and Raghadan are officially active in 2026; the coast plan uses only the public South Corniche and Al Nakheel Beach."}</span></div></div>
        <div class="status-rail">

          <div class="status-item"><span>${esc(t("cars"))}</span><strong>2 · A / B</strong></div>

    function renderTimelineItem(a,d){const done=!!state.completed[a.id],p=a.placeId?PLACES.find(x=>x.id===a.placeId):null;return `<div class="timeline-item ${done?"done":""}"><span class="timeline-dot"></span><div class="timeline-time">${esc(a.time)}</div><div class="timeline-content"><strong>${esc(l(a.title))}</strong><p>${esc(l(a.details))}</p><div class="timeline-actions"><button type="button" class="btn small ghost" data-action="toggle-activity" data-id="${a.id}">${icon("check",13)} ${done?esc(t("complete")):esc(t("markDone"))}</button>${p?`<a class="btn small ghost" href="${esc(p.g)}" target="_blank" rel="noopener">${icon("pin",13)} ${esc(t("openMaps"))}</a>`:""}</div></div></div>`}
    function renderWeather(){

    function renderActivity(a){const done=!!state.completed[a.id],p=a.placeId?PLACES.find(x=>x.id===a.placeId):null;return `<div class="activity ${done?"done":""}"><div class="time">${esc(a.time)}</div><div class="copy"><strong>${esc(l(a.title))}</strong><p>${esc(l(a.details))}</p>${p?`<div class="button-row"><a class="btn small ghost" href="${esc(p.g)}" target="_blank" rel="noopener">${icon("pin",13)} ${esc(t("openMaps"))}</a><a class="btn small ghost" href="${esc(p.a)}" target="_blank" rel="noopener">${esc(t("appleMaps"))}</a></div>`:""}</div><button type="button" class="check-btn" data-action="toggle-activity" data-id="${a.id}" aria-label="${esc(t("markDone"))}">${icon("check",17)}</button></div>`}
    function renderExplore(){const filtered=PLACES.filter(p=>state.placeFilter==="all"||p.type===state.placeFilter);return `<div class="section-head"><div><h2>${esc(t("exploreTitle"))}</h2><p>${esc(t("exploreSub"))}</p></div></div><div class="trust-strip">${icon("check",18)}<div><strong>${state.lang==="bn"?"Access rule":"Access rule"}</strong><span>${state.lang==="bn"?"Official/public visitor evidence ছাড়া কোনো attraction itinerary-তে রাখা হয়নি। Restaurant-এর জন্য hard-coded নামের বদলে live open-now search ব্যবহার করা হয়েছে।":"No attraction is scheduled without official/public visitor evidence. Restaurants use live open-now searches instead of hard-coded names."}</span></div></div><div class="filters">${[["all",t("all")],["mountain",t("mountain")],["sea",t("sea")],["food",t("food")],["routes",t("routes")]].map(([id,label])=>`<button type="button" class="filter-btn ${state.placeFilter===id?"active":""}" data-filter="${id}">${esc(label)}</button>`).join("")}</div><div class="place-list">${filtered.map(renderPlace).join("")}</div>`}

    function renderStay(){const total=selectedTotal(),pct=state.budgetTarget?Math.min(100,Math.round(total/state.budgetTarget*100)):0,status=total?(total<=state.budgetTarget?t("withinBudget"):t("overBudget")):t("noQuote");return `<div class="section-head"><div><h2>${esc(t("stayTitle"))}</h2><p>${esc(t("staySub"))}</p></div></div><div class="budget-panel"><div class="budget-line"><div><span>${esc(t("selectedTotal"))}</span><strong>${total?`SAR ${money(total)}`:"—"}</strong></div><div style="text-align:right"><span>${esc(t("budgetTarget"))}</span><strong style="font-size:17px">SAR ${money(state.budgetTarget)}</strong></div></div><div class="budget-bar"><i style="width:${pct}%"></i></div><div class="small muted" style="margin-top:8px">${esc(status)}</div></div><div class="notice teal">${icon("users",18)}<div>${esc(t("quoteNote"))}</div></div><div class="sp12"></div><div class="hotel-list">${HOTELS.map(renderHotel).join("")}</div>`}
    function renderHotel(h){const q=state.hotelQuotes[h.id],total=hotelTotal(h.id),selected=state.selectedHotel===h.id;return `<article class="hotel-card ${selected?"selected":""}"><div class="hotel-top"><div class="hotel-icon">${icon("hotel",21)}</div><div class="hotel-copy">${h.recommended?`<div class="recommend">${state.lang==="bn"?"আমার প্রথম পছন্দ":"Top pick"}</div>`:""}<h3>${esc(h.name)}</h3><p>${esc(l(h.sub))}</p></div></div><div class="place-meta">${h.traits.map(x=>`<span class="tag">${esc(l(x))}</span>`).join("")}</div><div class="quote-grid"><div class="field"><label>${esc(t("rooms"))}</label><input inputmode="numeric" type="number" min="1" max="10" data-quote="units" data-hotel="${h.id}" value="${q.units}"></div><div class="field"><label>${esc(t("nightly"))}</label><input inputmode="decimal" type="number" min="0" data-quote="nightly" data-hotel="${h.id}" value="${q.nightly||""}" placeholder="SAR"></div><div class="field"><label>${esc(t("nights"))}</label><input inputmode="numeric" type="number" min="1" max="14" data-quote="nights" data-hotel="${h.id}" value="${q.nights}"></div><div class="field"><label>${esc(t("fees"))}</label><input inputmode="decimal" type="number" min="0" data-quote="fees" data-hotel="${h.id}" value="${q.fees||""}" placeholder="SAR"></div></div><div class="quote-total"><div><span>${esc(t("total"))}</span><strong>${total?`SAR ${money(total)}`:"—"}</strong></div><div class="button-row" style="margin:0"><a class="btn small ghost" href="${esc(h.map)}" target="_blank" rel="noopener">${icon("pin",13)}</a>${h.phone?`<a class="btn small ghost" href="${esc(h.phone)}">Call</a>`:""}<button type="button" class="btn small ${selected?"gold":"primary"}" data-action="select-hotel" data-hotel="${h.id}">${selected?esc(t("selected")):esc(t("selectHotel"))}</button></div></div></article>`}
    function renderMore(){return `<div class="section-head"><div><h2>${esc(t("moreTitle"))}</h2><p>${esc(t("saveAuto"))}</p></div></div><div class="segmented">${[["family",t("family")],["packing",t("packing")],["return",t("return")],["settings",t("settings")]].map(([id,label])=>`<button type="button" class="${state.moreTab===id?"active":""}" data-more-tab="${id}">${esc(label)}</button>`).join("")}</div>${state.moreTab==="family"?renderFamily():state.moreTab==="packing"?renderPacking():state.moreTab==="return"?renderReturn():renderSettings()}`}
    function renderFamily(){const a=MEMBERS.filter(m=>state.cars[m.id]==="A").length,b=MEMBERS.filter(m=>state.cars[m.id]==="B").length,p=presentCount();return `<div class="car-summary"><div class="car-card"><span>${esc(t("carA"))}</span><strong>${a} / 13</strong></div><div class="car-card"><span>${esc(t("carB"))}</span><strong>${b} / 13</strong></div></div><div class="button-row" style="margin:0 0 12px"><button type="button" class="btn primary" data-action="all-present">${icon("check",15)} ${esc(t("allPresent"))}</button><button type="button" class="btn ghost" data-action="clear-present">${esc(t("clear"))}</button><span class="tag teal">${p}/13 ${esc(t("present"))}</span></div><div class="member-list">${MEMBERS.map(m=>`<div class="member-row"><div class="avatar">${esc(initials(m.name))}</div><div class="member-copy"><strong>${esc(l(m.name))}</strong><span>${esc(m.role)}</span></div><div class="member-control"><button type="button" class="present-toggle ${state.present[m.id]?"on":""}" data-action="toggle-present" data-member="${m.id}" aria-label="${esc(t("present"))}">${icon("check",15)}</button><select class="car-select" data-car="${m.id}" aria-label="Car"><option value="">—</option><option value="A" ${state.cars[m.id]==="A"?"selected":""}>A</option><option value="B" ${state.cars[m.id]==="B"?"selected":""}>B</option></select></div></div>`).join("")}</div><div class="sp12"></div><div class="notice">${icon("users",18)}<div>${state.lang==="bn"?"প্রতি departure, crowded place ও hotel checkout-এর আগে নতুন headcount করুন।":"Run a fresh headcount before every departure, crowded place and hotel checkout."}</div></div>`}
    function renderPacking(){return CHECKLISTS.map(c=>{const done=c.items.filter(i=>state.packing[i.id]).length;return `<section class="checklist-group"><div class="checklist-title"><strong>${esc(l(c.title))}</strong><span>${done}/${c.items.length}</span></div>${c.items.map(i=>`<div class="check-item ${state.packing[i.id]?"done":""}" data-action="toggle-pack" data-id="${i.id}"><span class="box">${icon("check",14)}</span><span>${esc(l(i.text))}</span></div>`).join("")}</section>`}).join("")}
    function renderReturn(){const opts=[
      ["direct",t("directDrive"),state.lang==="bn"?"দুই গাড়ি Riyadh নিতে পারবেন, কিন্তু drive খুব দীর্ঘ। Pre-dawn departure, driver rotation, live Maps, প্রতি ২ ঘণ্টায় break এবং stop-and-sleep rule বাধ্যতামূলক।":"Both cars reach Riyadh, but the drive is very long. Use pre-dawn departure, driver rotation, live Maps, two-hour breaks and a strict stop-and-sleep rule."],
      ["split",t("splitFlight"),state.lang==="bn"?"Family airport থেকে উড়বে, নির্ধারিত drivers গাড়ি ফিরিয়ে নেবে। Flight, airport, child logistics ও driver safety সম্পূর্ণ confirm না হলে এই option নেবেন না।":"Family flies while assigned drivers return the cars. Use only after flights, airport transfers, child logistics and driver safety are fully confirmed."],
      ["stopover",t("stopover"),state.lang==="bn"?"এক দিনে Riyadh পৌঁছানো unsafe হলে route-এর মাঝামাঝি verified hotel-এ rest করে পরদিন চালান।":"If reaching Riyadh in one day becomes unsafe, rest at a verified hotel en route and continue the next day."]
    ];return `<div class="option-list">${opts.map(([id,title,desc])=>`<button type="button" class="option-card ${state.returnMode===id?"selected":""}" data-return="${id}"><span class="option-radio"></span><h3>${esc(title)}</h3><p>${esc(desc)}</p></button>`).join("")}</div><div class="sp12"></div><div class="button-row"><a class="btn blue" href="${RIYADH_ROUTE}" target="_blank" rel="noopener">${icon("route",15)} ${esc(t("openMaps"))}</a><a class="btn ghost" href="${ABT_ROUTE}" target="_blank" rel="noopener">ABT route</a></div><div class="sp12"></div><div class="notice red">${icon("sun",18)}<div>${esc(t("safetyText"))}</div></div>`}
    function renderSettings(){return `<div class="panel panel-pad"><div class="quote-grid"><div class="field"><label>${esc(t("hotelName"))}</label><input type="text" data-setting="hotelName" value="${esc(state.settings.hotelName)}"></div><div class="field"><label>${esc(t("roomNumber"))}</label><input type="text" data-setting="room" value="${esc(state.settings.room)}"></div><div class="field"><label>${esc(t("emergency"))}</label><input type="tel" data-setting="emergency" value="${esc(state.settings.emergency)}"></div><div class="field"><label>${esc(t("budget"))}</label><input type="number" min="0" data-setting="budgetTarget" value="${state.budgetTarget}"></div></div><div class="sp12"></div><div class="field"><label>Family note</label><textarea data-setting="note">${esc(state.settings.note)}</textarea></div><div class="button-row"><a class="btn primary" href="${CURRENT_HOTEL}" target="_blank" rel="noopener">${icon("pin",15)} ${esc(t("hotelName"))}</a><button class="btn ghost" type="button" data-action="location">${icon("pin",15)} ${esc(t("useLocation"))}</button></div></div>
      <div class="sp12"></div><div class="panel panel-pad"><h3 style="margin:0 0 10px">${esc(t("shareTrip"))}</h3><div class="share-list"><button type="button" class="share-option" data-action="share-sheet"><span class="share-icon">${icon("share",19)}</span><span><strong>${esc(t("shareTrip"))}</strong><span>${esc(t("shareWhatsApp"))} · PDF · Notes</span></span></button><button type="button" class="share-option" data-action="calendar"><span class="share-icon">${icon("calendar",19)}</span><span><strong>${esc(t("calendar"))}</strong><span>${esc(t("addCalendar"))}</span></span></button><button type="button" class="share-option" data-action="install"><span class="share-icon">${icon("download",19)}</span><span><strong>${esc(t("install"))}</strong><span>${esc(t("installText"))}</span></span></button></div></div>
      <div class="sp12"></div><div class="panel panel-pad"><div class="button-row" style="margin:0"><button class="btn ghost" type="button" data-action="export">${icon("download",15)} ${esc(t("export"))}</button><button class="btn ghost" type="button" data-action="import">${icon("upload",15)} ${esc(t("import"))}</button><button class="btn danger" type="button" data-action="reset">${esc(t("reset"))}</button></div></div>`}

    function tripSummary(){
      const day=todayDay(),next=nextActivity(),sel=selectedHotel(),lines=[
        `✅ ${t("tripTitle")} · Verified-only`,
        `${t("tripRoute")}`,
        `14–19 Aug 2026 · 13 ${t("travellers")} · 2 ${t("cars")}`,
        "",
        `${t("today")}: ${l(day.title)}`,
        next?`${t("next")}: ${l(next.day.short)} ${next.activity.time} — ${l(next.activity.title)}`:"",
        `${t("hotelName")}: ${state.settings.hotelName||"Elhane Hotel"}${state.settings.room?` · ${state.settings.room}`:""}`,
        `${t("hotel")}: ${sel?sel.name:t("notSelected")}`,
        `${t("return")}: ${state.returnMode==="direct"?t("directDrive"):state.returnMode==="split"?t("splitFlight"):t("stopover")}`,
        "",
        `App: ${appUrl()}`,
        `Hotel Maps: ${CURRENT_HOTEL}`,
        `Red Sea route: ${BEACH_ROUTE}`,
        `Riyadh route: ${RIYADH_ROUTE}`
      ];
      if(state.settings.emergency)lines.push(`Emergency: ${state.settings.emergency}`);return lines.filter(Boolean).join("\n")
    }
    async function copyText(text){
      try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}throw new Error("fallback")}catch(_){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
    }
    function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200)}
    function openSheet(title,html){document.getElementById("sheetTitle").textContent=title;document.getElementById("sheetBody").innerHTML=html;document.getElementById("sheetWrap").hidden=false;document.body.style.overflow="hidden"}
    function closeSheet(){document.getElementById("sheetWrap").hidden=true;document.body.style.overflow=""}
    function shareSheet(){openSheet(t("shareTrip"),`<div class="share-list"><button type="button" class="share-option" data-action="share-whatsapp"><span class="share-icon">${icon("share",19)}</span><span><strong>${esc(t("shareWhatsApp"))}</strong><span>WhatsApp opens with the full plan prefilled</span></span></button><button type="button" class="share-option" data-action="native-share"><span class="share-icon">${icon("share",19)}</span><span><strong>${esc(t("nativeShare"))}</strong><span>AirDrop, Messages, Mail and more</span></span></button><button type="button" class="share-option" data-action="copy-notes"><span class="share-icon">${icon("note",19)}</span><span><strong>${esc(t("copyNotes"))}</strong><span>Paste directly into Apple Notes</span></span></button><button type="button" class="share-option" data-action="print"><span class="share-icon">${icon("download",19)}</span><span><strong>${esc(t("printPdf"))}</strong><span>${esc(t("pdfHelp"))}</span></span></button><button type="button" class="share-option" data-action="copy-link"><span class="share-icon">${icon("route",19)}</span><span><strong>${esc(t("copyLink"))}</strong><span>${esc(appUrl())}</span></span></button></div>`)}
    function routeSheet(){openSheet(t("route"),`<div class="share-list"><a class="share-option" href="${CURRENT_HOTEL}" target="_blank" rel="noopener"><span class="share-icon">${icon("hotel",19)}</span><span><strong>Elhane Hotel</strong><span>${esc(t("openMaps"))}</span></span></a><a class="share-option" href="${BEACH_ROUTE}" target="_blank" rel="noopener"><span class="share-icon">${icon("waves",19)}</span><span><strong>Al Bahah → Al Nakheel Beach</strong><span>Verified public beach route</span></span></a><a class="share-option" href="${RIYADH_ROUTE}" target="_blank" rel="noopener"><span class="share-icon">${icon("route",19)}</span><span><strong>Al Qunfudhah → Riyadh</strong><span>Long convoy route · live Maps</span></span></a></div>`)}
    async function shareNative(){try{if(navigator.share){await navigator.share({title:t("tripTitle"),text:tripSummary(),url:appUrl()})}else{await copyText(tripSummary());toast(t("copied"))}}catch(e){if(e&&e.name!=="AbortError")toast(t("unavailable"))}}
    function shareWhatsApp(text=tripSummary()){window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank","noopener")}
    function sharePlace(id){const p=PLACES.find(x=>x.id===id);if(p)shareWhatsApp(`${l(p.name)}\n${l(p.sub)}\nGoogle Maps: ${p.g}\nApple Maps: ${p.a}`)}
    function renderPrint(){
      const sel=selectedHotel(),total=selectedTotal();
      document.getElementById("printRoot").innerHTML=`<h1>${esc(t("tripTitle"))}</h1><p>${esc(t("tripRoute"))} · 14–19 August 2026 · 13 people · 2 cars</p><div class="print-grid"><div class="print-card"><strong>Current hotel</strong><br>${esc(state.settings.hotelName)} ${esc(state.settings.room||"")}<br>${esc(CURRENT_HOTEL)}</div><div class="print-card"><strong>Beach hotel</strong><br>${esc(sel?sel.name:t("notSelected"))}${total?`<br>SAR ${money(total)}`:""}<br>Return: ${esc(state.returnMode==="direct"?t("directDrive"):state.returnMode==="split"?t("splitFlight"):t("stopover"))}</div></div>${DAYS.map(d=>`<section class="print-day"><h2>${esc(l(d.short))} — ${esc(l(d.title))}</h2><p>${esc(l(d.loc))} · ${esc(l(d.summary))}</p><table>${d.activities.map(a=>`<tr><td>${esc(a.time)}</td><td>${state.completed[a.id]?"✓ ":""}<strong>${esc(l(a.title))}</strong><br>${esc(l(a.details))}${a.placeId&&mapLink(a.placeId)?`<br>${esc(mapLink(a.placeId))}`:""}</td></tr>`).join("")}</table></section>`).join("")}<div class="print-note"><strong>${esc(t("safety"))}</strong><p>${esc(t("safetyText"))}</p></div><div class="print-footer">Generated from K2Fam Trip · ${esc(appUrl())}</div>`
    }
    function printTrip(){renderPrint();setTimeout(()=>window.print(),80)}
    function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
    function exportState(){save();download("k2fam-trip-2026-backup.json",JSON.stringify(state,null,2),"application/json");toast(t("doneToast"))}
    function exportCalendar(){
      const pad=n=>String(n).padStart(2,"0"),dateBasic=s=>s.replaceAll("-","");let events="";
      for(const d of DAYS)for(const a of d.activities){const [hh,mm]=a.time.split(":").map(Number),endH=Math.min(23,hh+1);events+=`BEGIN:VEVENT\r\nUID:${a.id}@k2fam-trip\r\nDTSTAMP:20260814T000000Z\r\nDTSTART;TZID=Asia/Riyadh:${dateBasic(d.date)}T${pad(hh)}${pad(mm)}00\r\nDTEND;TZID=Asia/Riyadh:${dateBasic(d.date)}T${pad(endH)}${pad(mm)}00\r\nSUMMARY:${l(a.title).replace(/[\n,;]/g," ")}\r\nDESCRIPTION:${l(a.details).replace(/[\n,;]/g," ")}\r\nEND:VEVENT\r\n`}
      const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//K2Fam//Family Trip 2026//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n${events}END:VCALENDAR\r\n`;download("k2fam-trip-2026.ics",ics,"text/calendar;charset=utf-8");toast(t("doneToast"))
    }
    async function useLocation(){if(!navigator.geolocation){toast(t("unavailable"));return}navigator.geolocation.getCurrentPosition(async p=>{const url=`https://www.google.com/maps/search/?api=1&query=${p.coords.latitude},${p.coords.longitude}`;await copyText(url);toast(t("copied"))},()=>toast(t("unavailable")),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
    async function fetchWeather(){
      state.weatherStatus="loading";render();
      const cities=[[
        "albaha",20.0628511,41.5183857],["coast",19.1264,41.0789]
      ];
      try{
        for(const [id,lat,lon] of cities){
          const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,wind_gusts_10m_max&timezone=Asia%2FRiyadh&forecast_days=7`;
          const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("weather");const j=await r.json(),idx=0;
          state.weather[id]={temp:j.current?.temperature_2m??j.daily?.temperature_2m_max?.[idx],high:j.daily?.temperature_2m_max?.[idx],low:j.daily?.temperature_2m_min?.[idx],gust:j.daily?.wind_gusts_10m_max?.[idx],updated:new Date().toISOString()};
        }
        state.weatherStatus="ok";save();render();
      }catch(_){state.weatherStatus="failed";save();render();toast(t("unavailable"))}
    }
    async function installApp(){
      if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}
      openSheet(t("install"),`<div class="notice teal">${icon("download",18)}<div>${esc(t("installText"))}</div></div><div class="sp12"></div><div class="panel panel-pad"><strong>1.</strong> Safari-তে app খুলুন<br><br><strong>2.</strong> নিচের Share icon চাপুন<br><br><strong>3.</strong> “Add to Home Screen” নির্বাচন করুন</div>`)
    }
    function importState(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=normalize(JSON.parse(reader.result));save();render();toast(t("doneToast"))}catch(_){toast(t("unavailable"))}};reader.readAsText(file)}

    document.addEventListener("click",async e=>{
      const el=e.target.closest("[data-tab],[data-action],[data-day],[data-filter],[data-more-tab],[data-return]");if(!el)return;
      if(el.dataset.tab){state.tab=el.dataset.tab;render();document.getElementById("main").focus();return}
      if(el.dataset.day){state.activeDay=el.dataset.day;state.tab="plan";render();return}
      if(el.dataset.filter){state.placeFilter=el.dataset.filter;render();return}
      if(el.dataset.moreTab){state.moreTab=el.dataset.moreTab;render();return}
      if(el.dataset.return){state.returnMode=el.dataset.return;render();toast(t("doneToast"));return}
      const a=el.dataset.action;
      if(a==="language"){state.lang=state.lang==="bn"?"en":"bn";render()}
      else if(a==="share-sheet")shareSheet();
      else if(a==="close-sheet")closeSheet();
      else if(a==="route-sheet")routeSheet();
      else if(a==="share-whatsapp"){shareWhatsApp();closeSheet()}
      else if(a==="native-share"){await shareNative();closeSheet()}
      else if(a==="copy-notes"){await copyText(tripSummary());toast(t("copied"));closeSheet()}
      else if(a==="copy-link"){await copyText(appUrl());toast(t("copied"));closeSheet()}
      else if(a==="print"){closeSheet();printTrip()}
      else if(a==="toggle-activity"){state.completed[el.dataset.id]=!state.completed[el.dataset.id];render()}
      else if(a==="share-place")sharePlace(el.dataset.place);
      else if(a==="select-hotel"){state.selectedHotel=el.dataset.hotel;render();toast(t("doneToast"))}
      else if(a==="go-family"){state.tab="more";state.moreTab="family";render()}
      else if(a==="all-present"){MEMBERS.forEach(m=>state.present[m.id]=true);render()}
      else if(a==="clear-present"){MEMBERS.forEach(m=>state.present[m.id]=false);render()}
      else if(a==="toggle-present"){state.present[el.dataset.member]=!state.present[el.dataset.member];render()}
      else if(a==="toggle-pack"){state.packing[el.dataset.id]=!state.packing[el.dataset.id];render()}
      else if(a==="refresh-weather")fetchWeather();
      else if(a==="export")exportState();
      else if(a==="import")document.getElementById("importFile").click();
      else if(a==="calendar")exportCalendar();
      else if(a==="install")installApp();
      else if(a==="location")useLocation();
      else if(a==="reset"){if(confirm(state.lang==="bn"?"সব local data reset করবেন?":"Reset all local data?")){storage.removeItem(STORE_KEY);state=normalize(null);render()}}
    });
    document.addEventListener("change",e=>{
      const el=e.target;
      if(el.matches("[data-car]")){state.cars[el.dataset.car]=el.value;save();render()}
      else if(el.matches("[data-quote]")){const q=state.hotelQuotes[el.dataset.hotel];q[el.dataset.quote]=Math.max(0,Number(el.value)||0);save();render()}
      else if(el.id==="importFile"){importState(el.files?.[0]);el.value=""}
      else if(el.matches("[data-setting]")){const k=el.dataset.setting;if(k==="budgetTarget")state.budgetTarget=Math.max(0,Number(el.value)||0);else state.settings[k]=el.value;save();render()}
    });
    document.addEventListener("input",e=>{const el=e.target;if(el.matches("[data-setting]")&&!['budgetTarget'].includes(el.dataset.setting)){state.settings[el.dataset.setting]=el.value;save()}});
    document.getElementById("sheetWrap").addEventListener("click",e=>{if(e.target.id==="sheetWrap")closeSheet()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
    if("serviceWorker" in navigator&&["http:","https:"].includes(location.protocol)){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}


    const gate=document.getElementById("accessGate"),gateForm=document.getElementById("gateForm"),gateCode=document.getElementById("gateCode"),gateError=document.getElementById("gateError");
    function unlockGate(){sessionStorage.setItem("k2fam-access","ok");gate.hidden=true;gateCode.value=""}
    if(sessionStorage.getItem("k2fam-access")==="ok")gate.hidden=true;
    gateForm.addEventListener("submit",e=>{e.preventDefault();if(gateCode.value.trim()==="2026"){unlockGate()}else{gateError.textContent="Wrong family code";gateCode.select()}});

    render();
    const cachedFresh=state.weather.albaha&&Date.now()-new Date(state.weather.albaha.updated).getTime()<60*60*1000;
    if(!cachedFresh)setTimeout(fetchWeather,300);
    setInterval(()=>{if(state.tab==="home")render()},60000);
  })();
  </script>
</body>
</html>
