name: Deploy verified K2Fam Trip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: k2fam-trip-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3F08PKZvYI8K0Spij7yLQbPPF9L/c11b1d02-820f-46a6-8a5a-ae4dbae770f2.png
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download and extract verified app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          curl --fail --location --retry 3 "$PAYLOAD_URL" --output /tmp/k2fam-payload.png
          unzip -q /tmp/k2fam-payload.png -d docs
          test -s docs/index.html
          test -s docs/manifest.webmanifest
          test -s docs/sw.js
          touch docs/.nojekyll

      - name: Validate itinerary and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/index.html').read_text(encoding='utf-8')
          forbidden = ['Dhee Ayn', 'Khairah', 'Palm Beach', 'RUST', 'Fifth Season', 'Jazeera Saba', 'Sea Village']
          found = [name for name in forbidden if name.lower() in html.lower()]
          if found:
              raise SystemExit(f'Unverified destinations remain: {found}')
          required = ['Prince Hussam Park', 'Raghadan Forest Park', 'Al Nakheel Beach', 'South Corniche', '2026']
          missing = [name for name in required if name.lower() not in html.lower()]
          if missing:
              raise SystemExit(f'Required verified content missing: {missing}')
          match = re.search(r'<script>([\s\S]*?)</script>\s*</body>', html)
          if not match:
              raise SystemExit('Inline application script not found')
          Path('/tmp/k2fam-app.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/k2fam-app.js

      - name: Publish app source to main/docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "K2Fam Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No source update required."
          else
            git commit -m "Deploy verified K2Fam Trip app [skip ci]"
            git push origin HEAD:main
          fi

      - name: Try to enable branch-based GitHub Pages
        id: enable_pages
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response=/tmp/pages-response.json
          code=$(curl -sS -o "$response" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/docs"}}')
          echo "Pages enablement response: HTTP $code"
          cat "$response" || true
          if [ "$code" = "201" ] || [ "$code" = "204" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          exit 1

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy with GitHub Pages Actions when available
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
