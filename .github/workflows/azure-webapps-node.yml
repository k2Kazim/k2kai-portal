name: Publish verified K2Fam Trip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-webapps-node.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k2fam-trip-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3F08PKZvYI8K0Spij7yLQbPPF9L/40ca2b56-4e7f-415c-9e03-ff6d062494df.png
      LIVE_URL: https://k2kazim.github.io/k2kai-portal/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download and extract verified app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          curl --fail --location --retry 3 "$PAYLOAD_URL" --output /tmp/k2fam-payload.png
          unzip -q /tmp/k2fam-payload.png -d docs
          test -s docs/index.html
          test -s docs/manifest.webmanifest
          test -s docs/sw.js
          touch docs/.nojekyll

      - name: Validate verified-only itinerary and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/index.html').read_text(encoding='utf-8')
          forbidden_patterns = {
              'Dhee Ayn': r'Dhee\s+Ayn',
              'Khairah': r'Khairah',
              'Palm Beach': r'Palm\s+Beach',
              'RUST restaurant': r'(?<![A-Za-z])RUST(?![A-Za-z])',
              'Fifth Season': r'Fifth\s+Season',
              'Jazeera Saba': r'Jazeera\s+Saba',
              'Sea Village': r'Sea\s+Village',
          }
          found = [name for name, pattern in forbidden_patterns.items() if re.search(pattern, html, re.I)]
          if found:
              raise SystemExit(f'Unverified destinations remain: {found}')
          required = ['Prince Hussam Park', 'Raghadan Forest Park', 'Al Nakheel Beach', 'South Corniche', '2026']
          missing = [name for name in required if name.lower() not in html.lower()]
          if missing:
              raise SystemExit(f'Required verified content missing: {missing}')
          live_url = 'https://k2kazim.github.io/k2kai-portal/'
          if live_url not in html:
              raise SystemExit('Clean live share URL is not configured')
          match = re.search(r'<script>([\s\S]*?)</script>\s*</body>', html)
          if not match:
              raise SystemExit('Inline application script not found')
          Path('/tmp/k2fam-app.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/k2fam-app.js
          node --check docs/sw.js

      - name: Publish app source to main/docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "K2Fam Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No source update required."
          else
            git commit -m "Publish verified K2Fam Trip app [skip ci]"
            git push origin HEAD:main
          fi

      - name: Smoke-test public site availability
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            -D /tmp/live-headers.txt -o /tmp/live-index.html "$LIVE_URL?deploy=${GITHUB_RUN_ID}"
          grep -qi 'content-type:.*text/html' /tmp/live-headers.txt
          grep -q 'K2Fam Trip 2026' /tmp/live-index.html
          grep -q 'Prince Hussam Park' /tmp/live-index.html
          grep -q 'Raghadan Forest Park' /tmp/live-index.html
          grep -q 'Al Nakheel Beach' /tmp/live-index.html
          grep -q 'South Corniche' /tmp/live-index.html
          echo "PUBLIC_SITE_REACHABLE=$LIVE_URL"
